<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16295E"/>
      <stop offset="0.55" stop-color="#0E1B40"/>
      <stop offset="1" stop-color="#070D22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9CC2FF"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A1F"/>
      <stop offset="1" stop-color="#FF3B2F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="210" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="210" fill="url(#glow)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="205" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="12"/>
  
  <!-- seta circular de replay (volta no tempo) -->
  <path d="M 520 212 A 300 300 0 1 1 252.2 362.0" fill="none" stroke="url(#ring)" stroke-width="74" stroke-linecap="round"/>
  <polygon points="520,110 520,314 372,212" fill="url(#ring)" stroke="url(#ring)" stroke-width="18" stroke-linejoin="round"/>
  <!-- play -->
  <path d="M 452 372 Q 452 352 470 362 L 668 496 Q 686 512 668 528 L 470 662 Q 452 672 452 652 Z" fill="url(#play)"/>

</svg>